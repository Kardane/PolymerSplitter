plugins {
    id "net.fabricmc.fabric-loom"
}

ext {
    target_minecraft = "26.1.2"
    minecraft_range = ">=26.1 <26.2"
    loader_version = "0.18.4"
    fabric_api_version = "0.149.0+26.1.2"
    polymer_version = "0.16.5+26.1.2"
    java_version = 25
    adapter_source = "versions/modern/src/main/java"
    autohost_adapter_source = "versions/autohost-identifier-modern/src/main/java"
    mixin_source = "versions/mixin-modern/src/main/java"
    command_source = "versions/commands-modern/src/main/java"
}

apply from: rootProject.file("gradle/version-module.gradle")
